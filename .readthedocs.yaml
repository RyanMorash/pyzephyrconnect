# Read the Docs configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# Import the GitHub repository once in the Read the Docs dashboard.
# While this file exists, dashboard overrides are ignored.
# fail_on_warning matches the Sphinx job in CI.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
