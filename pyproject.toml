[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyzephyrconnect"
version = "0.1.0"
description = "Python client for Zephyr/Gemtek range hoods via AWS IoT device shadows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ryan Morash" }]
dependencies = [
    "aiohttp>=3.9",
    "pycognito>=2024.5.1",
    "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/RyanMorash/pyzephyrconnect"

[tool.hatch.build.targets.wheel]
# packages already walks the whole src/pyzephyrconnect tree, including
# certs/twca.pem - a force-include entry for the same path was here
# previously and made hatchling try to add that file to the wheel twice,
# which is a hard build error ("A second file is being added to the wheel
# archive at the same path"). Removed; verified below that the cert bundle
# still lands in the built wheel without it.
packages = ["src/pyzephyrconnect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
