[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyzephyrconnect"
version = "0.1.0"
description = "Python client for Zephyr Connect"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Morash", email = "ryan@morash.me"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "boto3>=1.34",
    "pycognito>=2024.5.1",
    "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    # Exact-pinned to match the ruff-action pin in .github/workflows/ci.yml,
    # so local runs and CI can never disagree. Bump both together.
    "ruff==0.14.14",
]

[project.urls]
github = "https://github.com/RyanMorash/pyzephyrconnect"
issues = "https://github.com/RyanMorash/pyzephyrconnect/issues"

[tool.hatch.build.targets.wheel]
# packages already walks the whole src/pyzephyrconnect tree, including
# certs/twca.pem - a force-include entry for the same path was here
# previously and made hatchling try to add that file to the wheel twice,
# which is a hard build error ("A second file is being added to the wheel
# archive at the same path"). Removed; verified below that the cert bundle
# still lands in the built wheel without it.
packages = ["src/pyzephyrconnect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff.lint]
# Docstrings follow the Google style guide, per Home Assistant's
# recommendation for integration libraries. extend-select (not select) so
# the D rules add to ruff's default E/F checks instead of replacing them.
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
